<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-family:var(--font-sans);font-size:12px;font-weight:500;border:1px solid var(--hairline)}</style>
</head><body>
<div class="row" style="flex-wrap:wrap;gap:8px">
  <span class="chip" style="background:var(--espresso);color:var(--cream);border-color:var(--espresso)">All</span>
  <span class="chip" style="background:#fff;color:var(--espresso)">Bridal</span>
  <span class="chip" style="background:#fff;color:var(--espresso)">Hair</span>
  <span class="chip" style="background:#fff;color:var(--espresso)">Facial</span>
  <span class="chip" style="background:#fff;color:var(--espresso)">Nail</span>
  <span class="chip" style="background:var(--blush);color:var(--espresso);border-color:var(--blush-deep)">New</span>
  <span class="chip" style="background:#E8D5B7;color:#5a4520;border-color:transparent">Popular</span>
  <span class="chip" style="background:rgba(107,142,90,0.15);color:#3f5b32;border-color:rgba(107,142,90,0.3)">● Open</span>
  <span class="chip" style="background:rgba(181,80,60,0.12);color:#7a3525;border-color:rgba(181,80,60,0.3)">Closed</span>
</div>
</body></html>
