<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.tok{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--hairline);font-family:var(--font-sans);font-size:13px}
.tok:last-child{border:0}
.tok b{font-weight:600;color:var(--espresso)}
.tok span{font-family:ui-monospace,monospace;font-size:12px;color:var(--taupe)}
</style></head><body>
<div class="tok"><b>fast · 120ms ease-out</b><span>micro feedback (icon hover)</span></div>
<div class="tok"><b>base · 200ms ease-out</b><span>buttons, hover, link underline</span></div>
<div class="tok"><b>slow · 400ms cubic-bezier(.22,1,.36,1)</b><span>card lifts, image zoom</span></div>
<div class="tok"><b>reveal · 600ms cubic-bezier(.22,1,.36,1)</b><span>scroll-in fade-up</span></div>
<div class="tok"><b>press · 100ms · scale(.98)</b><span>tap feedback, no color flash</span></div>
</body></html>
