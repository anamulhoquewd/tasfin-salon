<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:12px;font-family:var(--font-sans);font-size:14px;font-weight:600;letter-spacing:0.02em;cursor:pointer;border:1px solid transparent;transition:all 200ms var(--ease-out);text-decoration:none}
  .btn-primary{background:var(--espresso);color:var(--cream)}
  .btn-primary:hover{background:#1a110d}
  .btn-gold{background:var(--gold);color:var(--cream)}
  .btn-gold:hover{background:var(--gold-deep)}
  .btn-ghost{background:transparent;color:var(--espresso);border-color:var(--gold)}
  .btn-ghost:hover{background:var(--blush)}
  .btn-wa{background:#25D366;color:#fff}
  .btn-text{background:transparent;color:var(--espresso);padding:8px 0;border-bottom:1px solid var(--gold);border-radius:0}
</style></head><body>
