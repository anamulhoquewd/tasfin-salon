<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASFIN — Premium Beauty Salon in Dhaka</title>
<link rel="stylesheet" href="website.css">
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
const { useState } = React;
const App = () => {
  const [page, setPage] = useState('home');
  return (
    <>
      <Nav page={page} setPage={setPage}/>
      {page === 'home' && (
        <main>
          <Hero setPage={setPage}/>
          <Intro/>
          <ServicesPreview setPage={setPage}/>
          <PortfolioGrid teaser={true} setPage={setPage}/>
          <Testimonials/>
          <ContactCTA/>
        </main>
      )}
      {page === 'services'  && <ServicesPage/>}
      {page === 'portfolio' && <main><PortfolioGrid setPage={setPage}/></main>}
      {page === 'about'     && <AboutPage/>}
      <Footer setPage={setPage}/>
      <WhatsAppFAB/>
    </>
  );
};
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
