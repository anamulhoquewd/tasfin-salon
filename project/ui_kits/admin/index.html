<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TASFIN Admin</title>
<link rel="stylesheet" href="admin.css?v=3">
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../website/data.js"></script>
<script type="text/babel" src="AdminPages.jsx"></script>
<script type="text/babel" src="Calendar.jsx"></script>
<script type="text/babel" src="Inbox.jsx"></script>
<script type="text/babel">
const { useState } = React;
const titles = {
  dashboard: 'Dashboard',
  inbox: 'Booking inbox',
  calendar: 'Calendar',
  frontpage: 'Frontpage content',
  services: 'Services',
  portfolio: 'Portfolio',
  testimonials: 'Testimonials',
  faq: 'FAQ',
  contact: 'Contact information',
  media: 'Media library',
  reel: 'Reel settings',
  settings: 'Settings',
};
const App = () => {
  const [page, setPage] = useState('inbox');
  return (
    <AdminShell page={page} setPage={setPage} title={titles[page]}>
      {page === 'dashboard'    && <Dashboard/>}
      {page === 'inbox'        && <Inbox/>}
      {page === 'calendar'     && <Calendar/>}
      {page === 'frontpage'    && <Frontpage/>}
      {page === 'services'     && <ServicesEditor/>}
      {page === 'portfolio'    && <MediaLibrary/>}
      {page === 'testimonials' && <TestimonialsEditor/>}
      {page === 'media'        && <MediaLibrary/>}
      {page === 'reel'         && <ReelSettings/>}
      {page === 'contact'      && <ContactInfo/>}
      {(page === 'faq' || page === 'settings') && (
        <div className="ad-card"><h2>{titles[page]}</h2><div className="ad-card-desc">Editor scaffolds — same patterns as the other content editors.</div></div>
      )}
    </AdminShell>
  );
};
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
